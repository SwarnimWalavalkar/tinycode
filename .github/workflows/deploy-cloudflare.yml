name: Deploy durable agent

on:
  push:
    branches: [main]
    paths:
      - "packages/cloudflare-agent/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a deployment halfway through a Worker/container rollout.
concurrency:
  group: durable-agent-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "10.33.3"
      - run: pnpm install --frozen-lockfile
      - name: Check application and agent
        run: pnpm run check
      - name: Read deployment account
        id: account
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('packages/cloudflare-agent/wrangler.jsonc', 'utf8'));
          const id = config.vars.CLOUDFLARE_ACCOUNT_ID;
          if (!/^[a-f0-9]{32}$/i.test(id)) throw new Error('Invalid Cloudflare account ID');
          appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\n`);
          JS
      - name: Deploy Worker, hosted UI, and sandbox image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_DEPLOY_API_TOKEN repository secret before deploying."
            exit 1
          fi
          pnpm run deploy:cloudflare
      - name: Verify production routing and authentication gate
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://tiny-durable-agent.swarnim.workers.dev';
          for (let attempt = 0; ; attempt++) {
            try {
              const page = await fetch(base, { signal: AbortSignal.timeout(10000) });
              assert.equal(page.status, 200);
              const gated = await fetch(`${base}/api/bootstrap`, { signal: AbortSignal.timeout(10000) });
              assert.equal(gated.status, 401);
              break;
            } catch (error) {
              if (attempt === 5) throw error;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          JS
