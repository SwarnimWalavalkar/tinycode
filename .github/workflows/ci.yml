name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }}, ${{ matrix.pm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "22.19.0"
            pm: pnpm
            pmVersion: "10.33.3"
          - os: ubuntu-24.04
            node: "24"
            pm: pnpm
            pmVersion: "11.25.0"
          - os: macos-15
            node: "24"
            pm: pnpm
            pmVersion: "10.33.3"
          - os: ubuntu-24.04
            node: "24"
            pm: npm
          - os: ubuntu-24.04
            node: "24"
            pm: bun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: matrix.pm == 'pnpm'
        with:
          version: ${{ matrix.pmVersion }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.pm == 'bun'
        with:
          bun-version: "1.4.0"
      - run: pnpm install --frozen-lockfile
        if: matrix.pm == 'pnpm'
      - run: npm install --no-audit --no-fund
        if: matrix.pm == 'npm'
      - run: bun install
        if: matrix.pm == 'bun'
      - run: ${{ matrix.pm }} run check
      - run: ${{ matrix.pm }} run build
      - run: ${{ matrix.pm }} run test:smoke
